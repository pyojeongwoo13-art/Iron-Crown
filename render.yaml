services:
  - type: web
    name: iron-crown-server
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: iron-crown-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

databases:
  - name: iron-crown-db
    plan: free
    region: singapore
    databaseName: iron_crown
    user: iron_crown
    postgresMajorVersion: "18"
    ipAllowList: []
